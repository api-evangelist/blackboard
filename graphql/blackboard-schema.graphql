  notes: String
  created: String
  modified: String
}

# ─── Calendar Types ───────────────────────────────────────────────────────────

"""A calendar resource associated with a course or institution."""
type Calendar {
  id: ID!
  name: String
  type: String
  courseId: ID
  dynamicCalendarLinkUrl: String
  staticCalendarLinkUrl: String
}

"""An event on a calendar."""
type CalendarEvent {
  id: ID!
  type: String
  calendarId: String
  calendarName: String
  title: String
  description: String
  location: String
  start: String
  end: String
  disableResizing: Boolean
  isRecurring: Boolean
  recurrence: CalendarRecurrence
  dynamicCalendarLinkUrl: String
  staticCalendarLinkUrl: String
}

"""Recurrence rule for a calendar event."""
type CalendarRecurrence {
  byday: String
  count: Int
  frequency: String
  interval: Int
  until: String
}

# ─── LTI Types ────────────────────────────────────────────────────────────────

"""An LTI tool configuration registered in Blackboard."""
type LTI {
  id: ID!
  name: String
  description: String
  launchUrl: String
  consumerKey: String
  domain: String
  type: String
  allowMembership: Boolean
  globalNavigation: Boolean
  placements: [LTIPlacement]
}

"""A placement of an LTI tool within a course."""
type LTIPlacement {
  id: ID!
  courseId: ID!
  name: String
  description: String
  type: String
  launchUrl: String
  handle: String
  iconUrl: String
  availability: ContentAvailability
}

# ─── Webhook Types ────────────────────────────────────────────────────────────

"""A webhook subscription for receiving Blackboard events."""
type Webhook {
  id: ID!
  url: String!
  description: String
  status: String
  authInfo: WebhookAuthInfo
  eventTypes: [String]
  expirationDate: String
  created: String
  modified: String
}

"""Authentication configuration for a webhook endpoint."""
type WebhookAuthInfo {
  type: String
  secret: String
}

"""An event payload delivered by a webhook."""
type WebhookEvent {
  id: ID!
  webhookId: ID!
  eventType: String
  payload: String
  delivered: String
  status: String
}

# ─── Auth / Security Types ────────────────────────────────────────────────────

"""OAuth configuration for a Blackboard integration."""
type OAuth {
  clientId: ID!
  clientSecret: String
  redirectUri: String
  scopes: [String]
  description: String
}

"""An API key credential for accessing Blackboard APIs."""
type APIKey {
  id: ID!
  description: String
  key: String
  secret: String
  status: String
  created: String
  modified: String
  expirationDate: String
}

"""An OAuth access token."""
type Token {
  accessToken: String!
  tokenType: String
  expiresIn: Int
  refreshToken: String
  scope: String
}

# ─── Role / Permission Types ──────────────────────────────────────────────────

"""A role definition with associated permissions."""
type Role {
  id: ID!
  name: String
  description: String
  roleType: String
  permissions: [Permission]
}

"""A permission granted to a role."""
type Permission {
  id: ID!
  name: String
  description: String
  entitlementId: String
}

"""A system-level role assignment for a user."""
type SystemRole {
  id: ID!
  name: String
  description: String
  roleType: String
}

"""A course-level role assignment."""
type CourseRole {
  id: ID!
  courseId: ID!
  userId: ID!
  roleId: String
  roleName: String
  created: String
  modified: String
}

# ─── SIS / Data Source Types ──────────────────────────────────────────────────

"""A SIS data record for integration."""
type SISData {
  id: ID!
  dataSourceId: String
  externalId: String
  type: String
  status: String
  payload: String
  created: String
  modified: String
}

"""A data source used for SIS integration mappings."""
type DataSource {
  id: ID!
  externalId: String
  description: String
}

# ─── Connections / Pagination ─────────────────────────────────────────────────

"""Paginated list of courses."""
type CourseConnection {
  results: [Course]
  paging: PagingInfo
}

"""Paginated list of users."""
type UserConnection {
  results: [User]
  paging: PagingInfo
}

"""Paging metadata for a paginated result."""
type PagingInfo {
  nextPage: String
}

