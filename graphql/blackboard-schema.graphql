  pinned: Boolean
  posts: [Post]
}

"""An individual post in a discussion thread."""
type Post {
  id: ID!
  threadId: ID!
  forumId: ID!
  courseId: ID!
  parentId: String
  title: String
  body: String
  created: String
  modified: String
  author: String
  authorId: ID
  status: String
  position: Int
}

"""Extended metadata for a discussion post."""
type PostDetails {
  postId: ID!
  threadId: ID!
  forumId: ID!
  courseId: ID!
  parentId: String
  title: String
  body: String
  created: String
  modified: String
  author: String
  authorId: ID
  status: String
  wordCount: Int
  attachments: [Attachment]
  ratings: PostRatings
}

"""Aggregate rating information for a post."""
type PostRatings {
  averageRating: Float
  ratingCount: Int
}

